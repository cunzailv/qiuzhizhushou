<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'PingFang SC','Hiragino Sans GB','Songti SC',sans-serif">
  <rect width="1080" height="1920" fill="#FFFFFF"/>
  <text x="540" y="240" font-size="54" font-weight="700" fill="#1E3A8A" text-anchor="middle">不只打分，还告诉你差在哪</text>
  <rect x="120" y="380" width="420" height="820" rx="20" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="330" y="445" font-size="34" font-weight="700" fill="#DC2626" text-anchor="middle">差在哪</text>
  <g font-size="28" fill="#334155" text-anchor="middle">
    <text x="330" y="540">缺 K8s 实操经验</text>
    <text x="330" y="630">项目描述偏功能罗列</text>
    <text x="330" y="720">年限临界 2 年 8 个月</text>
  </g>
  <rect x="540" y="380" width="420" height="820" rx="20" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="750" y="445" font-size="34" font-weight="700" fill="#059669" text-anchor="middle">怎么改</text>
  <g font-size="28" fill="#334155" text-anchor="middle">
    <text x="750" y="540">补容器编排项目描述</text>
    <text x="750" y="630">改为量化业务指标</text>
    <text x="750" y="720">强调属可接受区间</text>
  </g>
  <text x="540" y="1320" font-size="38" font-weight="700" fill="#1E3A8A" text-anchor="middle">分数是用来筛的，差距才是用来改的</text>
</svg>
