name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      # 部分 runner 上 Playwright CDN 不可达：能装则跑全量浏览器 E2E，
      # 装不上就跳过这 10 个套件，其余逻辑/单测门禁照常执行。
      - name: Install Chromium (optional)
        run: |
          if npx playwright install chromium; then
            echo "Chromium ready, browser E2E will run"
          else
            echo "::warning::Chromium download failed; browser E2E suites skipped in this run"
            echo "SKIP_BROWSER_E2E=1" >> "$GITHUB_ENV"
          fi
      # 扩展 E2E 用 headless:false 加载 MV3 service worker，Linux runner 需要虚拟显示
      - name: Ensure xvfb is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y xvfb
          fi
      - run: xvfb-run -a npm test
