name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/

  test:
    runs-on: ubuntu-24.04
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      # Playwright 1.60 最高只支持 ubuntu24.04-x64，runner 固定 24.04。
      # 下载偶发失败时重试 3 次；仍失败则把输出写进 annotation 并让 job 失败，
      # 不再静默跳过浏览器 E2E（避免 CI 假绿）。
      - name: Install Chromium (required, retry + diagnostics)
        run: |
          set +e
          LOG=/tmp/pw-install.log
          : > "$LOG"
          {
            echo "node=$(node -v) npm=$(npm -v)"
            echo "playwright=$(npx playwright --version 2>&1)"
            grep -E '^(ID|VERSION_ID)=' /etc/os-release
          } | tee -a "$LOG"
          ok=0
          for attempt in 1 2 3; do
            echo "=== attempt ${attempt} ===" | tee -a "$LOG"
            npx playwright install --with-deps chromium >> "$LOG" 2>&1
            rc=$?
            echo "rc=$rc" | tee -a "$LOG"
            if [ "$rc" -eq 0 ]; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          if [ "$ok" -eq 1 ]; then
            echo "Chromium ready, browser E2E will run"
            echo "BROWSER_E2E=enabled" >> "$GITHUB_ENV"
          else
            python3 -c 'import sys; t=open(sys.argv[1],errors="replace").read()[-3500:]; print("::error::Chromium install failed after 3 attempts. diagnostics: "+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$LOG"
            tail -n 40 "$LOG"
            exit 1
          fi
      # 扩展 E2E 用 headless:false 加载 MV3 service worker，Linux runner 需要虚拟显示
      - name: Ensure xvfb is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y xvfb
          fi
      - name: Run tests
        run: |
          set +e
          xvfb-run -a npm test > /tmp/npm-test.log 2>&1
          rc=$?
          tail -n 40 /tmp/npm-test.log
          if [ "$rc" -eq 0 ]; then
            python3 -c 'import sys,re,os; t=open(sys.argv[1],errors="replace").read(); s=" | ".join(x.strip() for x in t.splitlines() if re.search(r"Test Files|Tests  |Duration",x)); print("::notice::BROWSER_E2E="+os.environ.get("BROWSER_E2E","?")+" vitest: "+s.replace("%","%25"))' /tmp/npm-test.log
          else
            python3 -c 'import sys; t=open(sys.argv[1],errors="replace").read()[-3500:]; print("::error::npm test failed. tail: "+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' /tmp/npm-test.log
          fi
          exit "$rc"
