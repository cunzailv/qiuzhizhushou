name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      # ubuntu-latest runner 镜像已预装 Chromium 运行依赖；--with-deps 会额外触发
      # apt 批量安装，在 runner 上易因包源/权限失败，这里只下载浏览器二进制。
      - run: npx playwright install chromium
      # 扩展 E2E 用 headless:false 加载 MV3 service worker，Linux runner 需要虚拟显示
      - name: Ensure xvfb is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y xvfb
          fi
      - run: xvfb-run -a npm test
