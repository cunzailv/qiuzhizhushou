name: 💡 功能建议
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "感谢你分享你的想法！"
  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 这个功能要解决什么问题？请描述你的使用场景
      placeholder: "例如：我想在猎聘上也能批量投递…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述你期望的功能或改进方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 新平台接入
        - 投递流程增强
        - AI 功能
        - UI/UX 优化
        - 其他
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、设计稿或其他相关信息
